[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htru2-pipeline"
version = "0.1.0"
description = "Pulsar candidate classification on HTRU2: a reproducible ML pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5", "pyarrow>=14"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
htru2-pipeline = "htru2_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
